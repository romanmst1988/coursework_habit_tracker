version: "3.9"

services:
  db:
    image: postgres:16
    container_name: habit-db
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: habit-redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: habit-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/habits
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: habit-celery
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: habit-celery-beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  pg_data:
